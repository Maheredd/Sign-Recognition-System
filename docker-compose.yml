services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sign-recognition-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - CORS_ORIGINS=*
      - DEBUG=false
      - LOG_LEVEL=INFO
    volumes:
      - ./Models:/app/Models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: sign-recognition-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:5000
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
